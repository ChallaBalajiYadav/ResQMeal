<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ResQMeal</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="ambient ambient-three"></div>

    <main class="login-container">
        <section class="login-card">

            <div class="floating-leaf leaf-one">🍃</div>
            <div class="floating-leaf leaf-two">🌿</div>

            <a href="index.html" class="logo">
                <span class="logo-icon">🍃</span>
                <span>ResQMeal</span>
            </a>

            <div class="heading">
                <span class="eyebrow">WELCOME BACK</span>
                <h1>Welcome Back<span class="heading-dot">.</span></h1>
                <p class="subtitle">
                    Good to see you again! Let's rescue more food together.
                </p>
            </div>

            <!-- Notification / Alert Message -->
            <div id="authAlert" class="auth-alert" role="alert"></div>

            <!-- Email and Password Login -->
            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group">
                    <div class="password-heading">
                        <label for="password">Password</label>
                        <a href="forgot-password.html" class="forgot-password">
                            Forgot password?
                        </a>
                    </div>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="login-button">
                    <span>Login to your account</span>
                    <span class="button-arrow">→</span>
                </button>

            </form>

            <div class="divider">
                <span>OR CONTINUE WITH</span>
            </div>

            <!-- Google Login: positioned at the bottom -->
            <button
                type="button"
                id="googleLoginBtn"
                class="google-login-btn"
            >
                <svg width="22" height="22" viewBox="0 0 48 48"
                     aria-hidden="true">
                    <path fill="#EA4335"
                        d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.5 13.3l7.8 6.1C12.2 13.1 17.6 9.5 24 9.5z"/>
                    <path fill="#4285F4"
                        d="M46.1 24.5c0-1.6-.2-3.2-.5-4.7H24v9h12.4c-.6 3-2.3 5.5-4.8 7.2l7.7 6C43.8 37.8 46.1 31.6 46.1 24.5z"/>
                    <path fill="#FBBC05"
                        d="M10.3 28.6A14.4 14.4 0 0 1 9.5 24c0-1.6.3-3.1.8-4.6l-7.8-6.1A23.8 23.8 0 0 0 0 24c0 3.9.9 7.5 2.5 10.7z"/>
                    <path fill="#34A853"
                        d="M24 48c6.4 0 11.8-2.1 15.7-6l-7.7-6c-2.1 1.4-4.8 2.2-8 2.2-6.4 0-11.8-4.3-13.7-10.1l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/>
                </svg>

                <span>Continue with Google</span>
                <span class="google-arrow">↗</span>
            </button>

            <p class="signup-text">
                New to ResQMeal?
                <a href="signup.html">Create an account</a>
            </p>

            <div class="bottom-link">
                <a href="index.html">← Back to Home</a>
            </div>

            <div class="card-footer">
                <span class="footer-leaf">♻</span>
                Together, we can reduce food waste.
            </div>

        </section>
    </main>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase Configuration -->
    <script src="js/supabase.js"></script>

    <!-- Authentication Logic -->
    <script src="js/auth.js"></script>

</body>
</html>
