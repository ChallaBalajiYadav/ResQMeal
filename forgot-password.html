<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | ResQMeal</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="ambient ambient-three"></div>

    <main class="login-container">
        <section class="login-card">

            <div class="floating-leaf leaf-one">🍃</div>
            <div class="floating-leaf leaf-two">🌿</div>

            <a href="index.html" class="logo">
                <span class="logo-icon">🍃</span>
                <span>ResQMeal</span>
            </a>

            <div class="heading">
                <span class="eyebrow">PASSWORD RESET</span>
                <h1>Forgot Password<span class="heading-dot">.</span></h1>
                <p class="subtitle">
                    Enter your email address and we'll send you a secure link to reset your password.
                </p>
            </div>

            <!-- Notification / Alert Message -->
            <div id="authAlert" class="auth-alert" role="alert"></div>

            <!-- Forgot Password Form -->
            <form id="forgotPasswordForm">

                <div class="input-group">
                    <label for="resetEmail">Email address</label>
                    <input
                        type="email"
                        id="resetEmail"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                    <span class="form-hint">We'll send a password recovery link to this email address.</span>
                </div>

                <button type="submit" id="resetSubmitBtn" class="login-button">
                    <span>Send Reset Link</span>
                    <span class="button-arrow">→</span>
                </button>

            </form>

            <div class="bottom-link">
                <a href="login.html">← Back to Login</a>
            </div>

            <div class="card-footer">
                <span class="footer-leaf">♻</span>
                Together, we can reduce food waste.
            </div>

        </section>
    </main>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase Configuration -->
    <script src="js/supabase.js"></script>

    <!-- Authentication Logic -->
    <script src="js/auth.js"></script>

</body>
</html>
